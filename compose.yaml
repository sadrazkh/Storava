services:
  storava-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: storava
      POSTGRES_USER: storava
      POSTGRES_PASSWORD: ${STORAVA_DB_PASSWORD:?Set STORAVA_DB_PASSWORD before starting Compose}
    volumes:
      - storava-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storava -d storava"]
      interval: 10s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  storava-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: storava-web:1.0.0
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      WebSecurity__UseHttpsRedirection: "false"
      Database__Provider: Postgres
      Database__ApplyMigrations: "true"
      ConnectionStrings__AccountDatabase: Host=storava-db;Port=5432;Database=storava;Username=storava;Password=${STORAVA_DB_PASSWORD}
      DataProtection__KeysPath: /home/app/.aspnet/DataProtection-Keys
      AccountEmail__DeliveryMode: Smtp
      AccountEmail__PublicBaseUrl: ${STORAVA_PUBLIC_BASE_URL:?Set STORAVA_PUBLIC_BASE_URL to the public HTTPS origin}
      AccountEmail__Host: ${STORAVA_SMTP_HOST:-}
      AccountEmail__Port: ${STORAVA_SMTP_PORT:-587}
      AccountEmail__UseSsl: ${STORAVA_SMTP_USE_SSL:-true}
      AccountEmail__Username: ${STORAVA_SMTP_USERNAME:-}
      AccountEmail__Password: ${STORAVA_SMTP_PASSWORD:-}
      AccountEmail__FromAddress: ${STORAVA_SMTP_FROM_ADDRESS:-}
      AccountEmail__FromName: ${STORAVA_SMTP_FROM_NAME:-Storava}
      DOTNET_EnableDiagnostics: "0"
    depends_on:
      storava-db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - storava-data-protection:/home/app/.aspnet/DataProtection-Keys
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  storava-db-data:
  storava-data-protection:
