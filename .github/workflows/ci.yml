name: Storava CI

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/Storava.Web/**'
      - 'tests/Storava.Web.Tests/**'
      - 'src/Storava.Agent/**'
      - 'tests/Storava.Agent.Tests/**'
      - 'src/Storava.App/**'
      - 'tests/Storava.App.Tests/**'
      - '.github/workflows/ci.yml'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'docs/WEB_*.md'
      - 'Directory.*.props'
      - 'Storava.slnx'

permissions:
  contents: read

concurrency:
  group: storava-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Storava.Web/package-lock.json
      - name: Restore .NET
        run: dotnet restore Storava.slnx
      - name: Install client dependencies
        working-directory: src/Storava.Web
        run: npm ci
      # One step each. Run together in a single block, only the last command's exit code decides
      # whether the step passed — a failing lint, typecheck or unit test would have been reported
      # as success because `npm run build` after it succeeded. Separate steps also say which check
      # failed without anybody opening the log.
      - name: Audit client dependencies
        working-directory: src/Storava.Web
        run: npm audit --audit-level=high
      - name: Lint client
        working-directory: src/Storava.Web
        run: npm run lint
      - name: Typecheck client
        working-directory: src/Storava.Web
        run: npm run typecheck
      - name: Client unit tests
        working-directory: src/Storava.Web
        run: npm run test
      - name: Build client
        working-directory: src/Storava.Web
        run: npm run build
      - name: Build .NET
        run: dotnet build Storava.slnx --configuration Release --no-restore
      - name: Test .NET
        run: dotnet test Storava.slnx --configuration Release --no-build
      - name: Install Playwright browser
        working-directory: src/Storava.Web
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: src/Storava.Web
        run: npm run test:e2e

  # The two editions a person installs. Built on every run rather than only on a tag, so a change
  # that breaks packaging is caught by the commit that made it instead of at release time.
  desktop:
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish companion agent
        run: dotnet publish src/Storava.Agent/Storava.Agent.csproj -p:PublishProfile=win-x64

      - name: Publish desktop edition
        run: dotnet publish src/Storava.App/Storava.App.csproj -p:PublishProfile=win-x64

      # Self-contained and single-file are the two claims the profiles make; a stray runtime
      # assembly beside the executable means one of them silently stopped being true.
      - name: Verify each edition is one self-contained file
        shell: pwsh
        run: |
          foreach ($edition in @(
            @{ Name = 'agent';   Path = 'artifacts/agent/win-x64';   Exe = 'storava-agent.exe' },
            @{ Name = 'desktop'; Path = 'artifacts/desktop/win-x64'; Exe = 'Storava.exe' }
          )) {
            $files = Get-ChildItem $edition.Path -File
            if ($files.Count -ne 1) {
              throw "$($edition.Name) published $($files.Count) files, expected 1: $($files.Name -join ', ')"
            }
            if ($files[0].Name -ne $edition.Exe) {
              throw "$($edition.Name) published $($files[0].Name), expected $($edition.Exe)"
            }
            "$($edition.Name): $($files[0].Name), $([math]::Round($files[0].Length / 1MB)) MB"
          }

      - name: Check the agent runs without a .NET runtime installed
        shell: pwsh
        run: |
          # Self-contained means it must not need the shared runtime. Emptying the environment's
          # hint variables is the cheapest approximation of a machine that has none.
          $env:DOTNET_ROOT = ''
          $env:DOTNET_MULTILEVEL_LOOKUP = '0'
          $output = & ./artifacts/agent/win-x64/storava-agent.exe status 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "agent status exited $LASTEXITCODE`n$output" }
          $output

      # Both installers, on every run. The release workflow builds them too, but only from a tag —
      # and an installer that stops building is something to hear about from the commit that broke
      # it rather than from the release nobody can cut.
      # One step each, for the same reason as in the release workflow: run together, a failure in
      # the first is hidden by the second succeeding.
      - name: Build the agent installer
        shell: pwsh
        run: |
          dotnet build src/Storava.Agent.Installer/Storava.Agent.Installer.wixproj
          if ($LASTEXITCODE -ne 0) { throw "The agent installer did not build." }

      - name: Build the desktop installer
        shell: pwsh
        run: |
          dotnet build src/Storava.App.Installer/Storava.App.Installer.wixproj
          if ($LASTEXITCODE -ne 0) { throw "The desktop installer did not build." }

      # ALLUSERS=2 reads like the careful choice and silently produces a machine-wide install on
      # an administrator's machine. The marker is only visible by reading the built package.
      - name: Verify both installers are per-user
        shell: pwsh
        run: |
          ./scripts/verify-installer.ps1 -MsiPath artifacts/installers/StoravaAgent.msi
          ./scripts/verify-installer.ps1 -MsiPath artifacts/installers/Storava.msi

      - uses: actions/upload-artifact@v4
        with:
          name: storava-windows-x64
          path: |
            artifacts/agent/win-x64/storava-agent.exe
            artifacts/desktop/win-x64/Storava.exe
            artifacts/installers/StoravaAgent.msi
            artifacts/installers/Storava.msi
          if-no-files-found: error
          retention-days: 14

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag storava-web:ci .
      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect storava-web:ci --format '{{.Config.User}}')" != ""
          test "$(docker image inspect storava-web:ci --format '{{.Config.Healthcheck.Test}}')" != "<nil>"
