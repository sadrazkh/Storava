name: Storava Web CI

on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'src/Storava.Web/**'
      - 'tests/Storava.Web.Tests/**'
      - 'src/Storava.Agent/**'
      - 'tests/Storava.Agent.Tests/**'
      - '.github/workflows/web-ci.yml'
      - 'Dockerfile'
      - 'compose.yaml'
      - '.dockerignore'
      - 'docs/WEB_*.md'
      - 'Directory.*.props'
      - 'Storava.slnx'

permissions:
  contents: read

concurrency:
  group: storava-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/Storava.Web/package-lock.json
      - name: Restore .NET
        run: dotnet restore Storava.slnx
      - name: Install client dependencies
        working-directory: src/Storava.Web
        run: npm ci
      - name: Verify client
        working-directory: src/Storava.Web
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run typecheck
          npm run test
          npm run build
      - name: Build .NET
        run: dotnet build Storava.slnx --configuration Release --no-restore
      - name: Test .NET
        run: dotnet test Storava.slnx --configuration Release --no-build
      - name: Install Playwright browser
        working-directory: src/Storava.Web
        run: npx playwright install chromium
      - name: Browser tests
        working-directory: src/Storava.Web
        run: npm run test:e2e

  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag storava-web:ci .
      - name: Verify non-root runtime
        run: |
          test "$(docker image inspect storava-web:ci --format '{{.Config.User}}')" != ""
          test "$(docker image inspect storava-web:ci --format '{{.Config.Healthcheck.Test}}')" != "<nil>"
